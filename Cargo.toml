[workspace]
resolver = "2"
members = [
  "contracts/*",
]
default-members = [
  ".",
  "contracts/market",
  "contracts/outcome-token",
  "contracts/resolution",
]

[workspace.dependencies]
soroban-sdk = "23"
# Soroban 23.0.x is built against the legacy 'rand 0.8 / rand_chacha 0.3 / ed25519-dalek 2.2'
# stack. Pinning these versions at the workspace level keeps the host test utilities and our
# test-only signing code on the same compatible RNG trait set.
ed25519-dalek = "=2.2.0"
curve25519-dalek = "=4.1.3"
rand = "=0.8.5"
rand_chacha = "=0.3.1"

# Pin ed25519-dalek to v2 across the whole workspace.
# soroban-env-host 23.x declares `>= 2.0.0` but its testutils code calls
# `SigningKey::generate` with a ChaCha20Rng, which stopped implementing
# CryptoRng in v3. Pinning to the exact 2.2.0 release keeps tests compilable.
ed25519-dalek = "=2.2.0"

# NOTE: the pin above only constrains crates in this workspace that opt in
# via `{ workspace = true }` — it does NOT force soroban-env-host's own
# (unconstrained `>= 2.0.0`) transitive dependency on ed25519-dalek to the
# same version. Cargo can't "patch" a crate to a different version from the
# *same* registry source (`[patch]` requires a different source). The only
# reliable fix is a committed `Cargo.lock` — see the note in `.gitignore`
# and `Cargo.lock`'s own presence in this repo (#701).

# The workspace root doubles as a package whose only purpose is to host the
# end-to-end integration tests under `tests/`. It ships no library code.
[package]
name = "vatix-contract-tests"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[dev-dependencies]
vatix-market-contract = { path = "contracts/market" }
vatix-treasury-contract = { path = "contracts/treasury" }
vatix-outcome-token-contract = { path = "contracts/outcome-token" }
vatix-resolution-contract = { path = "contracts/resolution" }
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = { workspace = true }
rand = "0.8"
proptest = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
