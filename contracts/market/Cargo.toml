[package]
name = "vatix-market-contract"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "2.2.0"
rand = "0.8"

proptest = "1"

[[test]]
name = "proptest_locked_invariant"
path = "../../tests/proptest_locked_invariant.rs"
