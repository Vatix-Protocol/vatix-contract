[package]
name = "vatix-market-contract"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
# default-features = false: drops "std" (incompatible with this contract's
# #![no_std]/wasm32v1-none target) and "fast"/"zeroize" (unneeded WASM size).
# Used for oracle signature verification - see contracts/market/src/oracle.rs.
ed25519-dalek = { version = "2.2.0", default-features = false }
vatix-outcome-token-contract = { path = "../outcome-token" }
vatix-resolution-contract = { path = "../resolution" }

[features]
# Explicit adapter build for CI size-budget checks (#734).
# The oracle_adapter module is compiled in the default wasm as well; this
# flag exists so scripts/check-market-wasm-size.sh can build both shapes
# and fail if either exceeds MARKET_WASM32_SIZE_BUDGET (64 KiB).
oracle-adapter = []

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand = { workspace = true }
vatix-treasury-contract = { path = "../treasury" }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
